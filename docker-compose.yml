services:
  # --- DATABASES (One container per service) ---

  mysql-product:
    image: mysql:8.0
    container_name: mysql-product
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: product_db
    ports:
      - "3306:3306"
    volumes:
      - product-db-data:/var/lib/mysql
    networks:
      - iae-network

  mysql-order:
    image: mysql:8.0
    container_name: mysql-order
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: order_db
    ports:
      - "3307:3306"
    volumes:
      - order-db-data:/var/lib/mysql
    networks:
      - iae-network

  # Stock Service Database (Port 3311)
  mysql-stock:
    image: mysql:8.0
    container_name: stock-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stock_db
      MYSQL_USER: stock_user
      MYSQL_PASSWORD: stock_password
    ports:
      - "3312:3306"
      - "3311:3306"
 main
    volumes:
      - stock-db-data:/var/lib/mysql
    networks:
      - iae-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-shipping:
    image: mysql:8.0
    container_name: mysql-shipping
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shipping_db
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3310:3306"
    volumes:
      - shipping-db-data:/var/lib/mysql
    networks:
      - iae-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- SERVICES ---

  product-service:
    build: ./services/product-service
    container_name: product-service
    ports:
      - "8001:8000"
    env_file:
      - ./services/product-service/.env
    depends_on:
      - mysql-product
    networks:
      - iae-network

  order-service:
    build: ./services/order-service
    container_name: order-service
    ports:
      - "8002:8000"
    env_file:
      - ./services/order-service/.env
    depends_on:
      - mysql-order
    networks:
      - iae-network

  # Stock Service (Port 8003) - Auth Provider & Inventory Management
  stock-service:
    build: ./services/stock-service
    container_name: stock-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    env_file:
      - ./services/stock-service/.env
    depends_on:
      mysql-stock:
        condition: service_healthy
    networks:
      - iae-network
    volumes:
      - ./services/stock-service:/var/www
      - /var/www/vendor
    command: >
      sh -c "
        composer install --no-interaction --prefer-dist &&
        php artisan key:generate --force &&
        php artisan migrate:fresh --seed --force &&
        php artisan serve --host=0.0.0.0 --port=8003
      "

  shipping-service:
    build: ./services/shipping-service
    container_name: shipping-service
    restart: unless-stopped
    ports:
      - "8004:8000"
    env_file:
      - ./services/shipping-service/.env
    depends_on:
      - mysql-shipping
      - stock-service
    networks:
      - iae-network
    volumes:
      - ./services/shipping-service:/var/www
      - /var/www/vendor
    command: >
      sh -c "
        composer install --no-interaction --prefer-dist &&
        php artisan key:generate --force &&
        php artisan migrate:fresh --force &&
        php artisan serve --host=0.0.0.0 --port=8000
      "

volumes:
  product-db-data:
  order-db-data:
  stock-db-data:
  shipping-db-data:

networks:
  iae-network:
    driver: bridge

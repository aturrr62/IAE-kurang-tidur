# GraphQL Query Examples for Testing

## Authentication Queries

### Login
```graphql
mutation Login {
  login(username: "admin", password: "admin123") {
    token
    expiresIn
    user {
      id
      username
      name
      email
      role
      department
    }
  }
}
```

### Get Current User
```graphql
query GetMe {
  me {
    id
    username
    name
    email
    role
    department
    createdAt
    updatedAt
  }
}
```

### Logout
```graphql
mutation Logout {
  logout
}
```

## Stock Checking (For Integration)

### Single Product Check
```graphql
query CheckSingleStock {
  checkStock(productCode: "ELECT-001", quantity: 5) {
    productCode
    productName
    available
    currentStock
    requestedQuantity
    message
  }
}
```

### Bulk Stock Check
```graphql
query BulkStockCheck {
  bulkCheckStock(items: [
    { productCode: "ELECT-001", quantity: 5 },
    { productCode: "ELECT-002", quantity: 10 },
    { productCode: "ELECT-003", quantity: 3 }
  ]) {
    allAvailable
    results {
      productCode
      productName
      available
      currentStock
      requestedQuantity
      message
    }
  }
}
```

### Get Inventory Item
```graphql
query GetInventoryItem {
  inventory(productCode: "ELECT-001") {
    id
    productCode
    productName
    currentStock
    minStockLevel
    maxStockLevel
    createdAt
    updatedAt
  }
}
```

### List All Inventory
```graphql
query ListAllInventory {
  inventoryList {
    id
    productCode
    productName
    currentStock
    minStockLevel
    maxStockLevel
  }
}
```

### List Low Stock Items
```graphql
query LowStockItems {
  inventoryList(lowStockOnly: true) {
    productCode
    productName
    currentStock
    minStockLevel
  }
}
```

### Search Inventory
```graphql
query SearchInventory {
  inventoryList(search: "Laptop") {
    productCode
    productName
    currentStock
  }
}
```

## Stock Management

### Increment Stock
```graphql
mutation IncrementStock {
  updateStock(input: {
    productCode: "ELECT-001"
    quantity: 50
    action: INCREMENT
    note: "Restocking from supplier"
  }) {
    id
    productCode
    productName
    currentStock
    minStockLevel
    maxStockLevel
  }
}
```

### Decrement Stock
```graphql
mutation DecrementStock {
  updateStock(input: {
    productCode: "ELECT-001"
    quantity: 10
    action: DECREMENT
    note: "Damaged items removed"
  }) {
    productCode
    productName
    currentStock
  }
}
```

### Reserve Stock for Order
```graphql
mutation ReserveStockForOrder {
  reserveStock(input: {
    productCode: "ELECT-001"
    quantity: 5
    orderId: "ORD-2024-001"
  }) {
    productCode
    productName
    available
    currentStock
    requestedQuantity
    message
  }
}
```

### Release Reserved Stock
```graphql
mutation ReleaseReservedStock {
  releaseStock(
    productCode: "ELECT-001"
    quantity: 5
    orderId: "ORD-2024-001"
  ) {
    productCode
    productName
    currentStock
  }
}
```

### Adjust Stock (Admin/Manager Only)
```graphql
mutation AdjustStockLevel {
  adjustStock(
    productCode: "ELECT-001"
    newStock: 100
    note: "Stock opname correction - physical count"
  ) {
    productCode
    productName
    currentStock
  }
}
```

## Staff Management

### Register New Staff (Admin Only)
```graphql
mutation RegisterNewStaff {

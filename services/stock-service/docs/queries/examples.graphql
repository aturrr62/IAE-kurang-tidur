## Monitoring & Alerts

### Get Active Alerts
```graphql
query GetActiveAlerts {
  lowStockAlerts(resolved: false) {
    id
    productCode
    alertType
    currentStock
    resolved
    createdAt
    inventory {
      productName
      minStockLevel
    }
  }
}
```

### Get Resolved Alerts
```graphql
query GetResolvedAlerts {
  lowStockAlerts(resolved: true) {
    id
    productCode
    alertType
    resolved
    resolvedAt
    resolver {
      name
      role
    }
  }
}
```

### Resolve Alert
```graphql
mutation ResolveStockAlert {
  resolveAlert(alertId: 1) {
    id
    productCode
    alertType
    resolved
    resolvedAt
    resolver {
      id
      name
      role
    }
  }
}
```

### Get Stock Transaction History
```graphql
query GetStockTransactions {
  stockTransactions(limit: 20) {
    id
    productCode
    quantity
    action
    note
    stockBefore
    stockAfter
    createdAt
    staff {
      name
      role
    }
    inventory {
      productName
    }
  }
}
```

### Get Transactions for Specific Product
```graphql
query GetProductTransactions {
  stockTransactions(productCode: "ELECT-001", limit: 10) {
    id
    quantity
    action
    note
    stockBefore
    stockAfter
    createdAt
    staff {
      name
      username
    }
  }
}
```

### Filter Transactions by Action
```graphql
query GetReserveTransactions {
  stockTransactions(action: RESERVE, limit: 10) {
    id
    productCode
    quantity
    note
    stockBefore
    stockAfter
    createdAt
    inventory {
      productName
    }
  }
}
```

## Complex Queries with Relationships

### Inventory with Alerts and Transactions
```graphql
query InventoryDetail {
  inventory(productCode: "ELECT-001") {
    id
    productCode
    productName
    currentStock
    minStockLevel
    maxStockLevel
    createdAt
    
    alerts {
      id
      alertType
      resolved
      createdAt
    }
    
    transactions {
      id
      quantity
      action
      note
      createdAt
      staff {
        name
      }
    }
  }
}
```

## Variables Examples

### Using Variables for Flexible Queries
```graphql
query CheckStockWithVariables($code: String!, $qty: Int!) {
  checkStock(productCode: $code, quantity: $qty) {
    productCode
    available
    currentStock
    requestedQuantity
    message
  }
}

# Variables:
{
  "code": "ELECT-001",
  "qty": 5
}
```

### Bulk Check with Variables
```graphql
query BulkCheckWithVariables($items: [BulkStockCheckInput!]!) {
  bulkCheckStock(items: $items) {
    allAvailable
    results {
      productCode
      available
      currentStock
      message
    }
  }
}

# Variables:
{
  "items": [
    { "productCode": "ELECT-001", "quantity": 5 },
    { "productCode": "ELECT-002", "quantity": 10 }
  ]
}
```

### Update Stock with Variables
```graphql
mutation UpdateStockWithVariables($input: UpdateStockInput!) {
  updateStock(input: $input) {
    productCode
    currentStock
  }
}

# Variables:
{
  "input": {
    "productCode": "ELECT-001",
    "quantity": 20,
    "action": "INCREMENT",
    "note": "Restocking"
  }
}
```

## Authorization Examples

### With JWT Token (Internal)
```
Headers:
{
  "Authorization": "Bearer eyJ0eXAiOiJKV1QiLCJhbGc..."
}
```

### With API Key (External)
```
Headers:
{
  "X-API-Key": "stock_api_key_external_2024"
}
```

### Both (Fallback)
```
Headers:
{
  "Authorization": "Bearer eyJ0eXAiOiJKV1QiLCJhbGc...",
  "X-API-Key": "stock_api_key_external_2024"
}
```
